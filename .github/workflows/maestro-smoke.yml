name: Maestro smoke test

on:
  pull_request:
    paths:
      - "react-native/**"
      - ".github/workflows/maestro-smoke.yml"
  # Runs on main so the Gradle and AVD caches get written to the default branch.
  # GitHub scopes caches by branch: PRs can read main's caches but never each
  # other's, so without this every PR starts from a cold cache.
  push:
    branches: [main]
    paths:
      - "react-native/**"
      - ".github/workflows/maestro-smoke.yml"
  workflow_dispatch:

concurrency:
  group: maestro-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 35

jobs:
  build:
    name: Build APK
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: react-native

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: react-native/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The Gradle project lives in the prebuild output, which doesn't exist
          # yet. This step only needs to manage the Gradle user home cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check map credentials
        env:
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: test -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN"

      - name: Prebuild Android project
        run: pnpm expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}

      # Prebuild regenerates android/ every run, so these can't be committed.
      # Later keys win in a properties file, overriding Expo's defaults.
      - name: Enable Gradle caching
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF

      - name: Build release APK
        run: >-
          ./android/gradlew -p android assembleRelease
          --build-cache
          -PreactNativeArchitectures=x86_64 -x lintVitalRelease
        env:
          NODE_ENV: production
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: react-native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0

  test:
    name: Smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: react-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: react-native/apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.6.1 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-pixel_6

      # A cold AVD boots and saves a snapshot; the run below restores it instead
      # of booting from scratch.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: react-native
          script: |
            # Suppress ANR dialogs so a slow system app can't cover the app under test.
            adb shell settings put global hide_error_dialogs 1
            adb install -r apk/app-release.apk
            mkdir -p ~/.maestro/tests
            # The runner executes each line separately, so logcat capture has to share the maestro line.
            maestro test .maestro/01-launch-and-tabs.yml .maestro/02-search.yml .maestro/03-map-and-circuit.yml .maestro/04-grade-filter.yml || { adb logcat -d -b main,system,crash > ~/.maestro/tests/logcat.txt; exit 1; }
            # Force offline so the contribute submit takes the offline-queue path deterministically (adb/Maestro are unaffected).
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            maestro test .maestro/05-contribute.yml || { adb logcat -d -b main,system,crash > ~/.maestro/tests/logcat.txt; exit 1; }

      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-diagnostics
          path: ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 7
