name: PR preview

on:
  pull_request_comment:
    if: ${{ startsWith(github.event.comment.body, '/preview') && github.event.comment.author_association == 'OWNER' }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: development
    env:
      APP_VARIANT: dev

  get_ios_build:
    name: Find matching iOS dev build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: development
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS dev client
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: development

  publish_update:
    name: Publish PR update
    needs: [get_ios_build]
    after: [build_ios]
    if: ${{ needs.get_ios_build.outputs.build_id || needs.build_ios.outputs.build_id }}
    type: update
    environment: development
    env:
      APP_VARIANT: dev
    params:
      platform: ios
      branch: pr-${{ github.event.pull_request.number }}

  comment:
    name: Comment preview link
    needs: [publish_update]
    after: [build_ios]
    type: github-comment
    params:
      payload: |
        iOS preview of `${{ github.sha }}` is ready.

        **[Open on iPhone](https://cirque-api.nathan-hadley.workers.dev/preview/${{ needs.publish_update.outputs.first_update_group_id }}?build=${{ needs.build_ios.outputs.build_id }})**

  comment_failure:
    name: Comment failure
    after: [build_ios, publish_update]
    if: ${{ failure() }}
    type: github-comment
    params:
      message: iOS preview failed.
      update_group_ids: []
