appId: com.nathanhadley.Cirque
name: Validate and submit a contributed problem
---
- runFlow: subflows/launch.yml
- tapOn: "Contribute"
- scrollUntilVisible:
    element:
      id: submit-problem
    direction: DOWN
- tapOn:
    id: submit-problem
- assertVisible: "Please fill out all required fields."

# Dismiss the keyboard by tapping a section label instead of hideKeyboard. On
# Android hideKeyboard presses back, which leaves the Contribute tab if the
# keyboard is already down.
- scrollUntilVisible:
    element:
      id: contact-name-input
    direction: UP
- tapOn:
    id: contact-name-input
- inputText: "Maestro Tester"
- tapOn: "Contact information"
- tapOn:
    id: contact-email-input
- inputText: "maestro@example.com"
- tapOn: "Contact information"
- scrollUntilVisible:
    element:
      id: problem-name-input
    direction: DOWN
- tapOn:
    id: problem-name-input
- inputText: "Maestro Test Problem"
- tapOn: "Problem details"
- tapOn:
    id: open-grade-picker
- assertVisible: "Select grade"
# The picker defaults to V3; closing confirms that valid default selection.
- tapOn:
    id: close-grade-picker
- tapOn:
    id: open-area-picker
- assertVisible: "Select area"
- tapOn:
    id: area-option-forestland
- tapOn:
    id: close-area-picker
- scrollUntilVisible:
    element:
      id: latitude-input
    direction: DOWN
- tapOn:
    id: latitude-input
- inputText: "47.596"
- tapOn: "Coordinates"
- tapOn:
    id: longitude-input
- inputText: "-120.661"
- tapOn: "Coordinates"
- scrollUntilVisible:
    element:
      id: problem-description-input
    direction: DOWN
- tapOn:
    id: problem-description-input
- inputText: "Start on the low rail and climb straight to the top."
- tapOn: "Description"
- scrollUntilVisible:
    element:
      id: submit-problem
    direction: DOWN
- tapOn:
    id: submit-problem
- assertVisible: "Problem (submitted successfully|saved).*"
