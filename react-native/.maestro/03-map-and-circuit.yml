appId: com.nathanhadley.Cirque
name: Circuit entry, navigation, and map tap
---
- runFlow: subflows/launch.yml
- tapOn: "About"
- tapOn:
    id: circuit-card-forestland-black
# The problem detail is a native sheet; allow its present animation to finish.
- extendedWaitUntil:
    visible: "The Shallow"
    timeout: 10000
# Circuit navigation via the prev/next buttons
- tapOn:
    id: circuit-next-problem
- assertVisible: "Cube Crack"
- tapOn:
    id: circuit-next-problem
- assertVisible: "The Cube"
- tapOn:
    id: circuit-previous-problem
- assertVisible: "Cube Crack"
# Navigate by tapping the map instead of the buttons: dismiss the sheet, then
# tap the centered problem's marker to reopen it. Cube Crack is centered here.
#
# Dismiss with back rather than a drag, which sometimes leaves the sheet at
# its detent on CI. TrueSheet handles back while presented, so this never
# leaves the map tab.
- pressKey: back
- extendedWaitUntil:
    notVisible: "Cube Crack"
    timeout: 8000
# Reopen by tapping the marker. flyToProblemCoordinates centers the selected
# problem with paddingBottom = 40% of screen height, which lands its marker at
# ~30% down (not 24%).
- tapOn:
    point: "50%, 30%"
- extendedWaitUntil:
    visible: "Cube Crack"
    timeout: 8000
